[platformio]
default_envs = ghost-a

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  paulstoffregen/XPT2046_Touchscreen@^1.4
  h2zero/NimBLE-Arduino@^2.3.6
build_flags =
  -I include
  -include include/User_Setup_Ghostlink.h
  -D CORE_DEBUG_LEVEL=1

[env:ghost-a]
extends = env
build_flags =
  ${env.build_flags}
  -D GHOST_NODE_ROLE=0

[env:ghost-b]
extends = env
build_flags =
  ${env.build_flags}
  -D GHOST_NODE_ROLE=1
