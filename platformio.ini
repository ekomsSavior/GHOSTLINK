[platformio]
default_envs = ghost-a

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
  h2zero/NimBLE-Arduino@2.3.6
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I include
  -include include/User_Setup_Ghostlink.h
  -D CORE_DEBUG_LEVEL=1

[env:ghost-a]
extends = env
build_flags =
  ${env.build_flags}
  -D GHOST_NODE_ROLE=0

[env:ghost-b]
extends = env
build_flags =
  ${env.build_flags}
  -D GHOST_NODE_ROLE=1
